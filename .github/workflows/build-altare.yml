name: Build Altare Image

on:
  push:
    paths:
      - 'Dockerfile.altare'
      - 'deploy/altare/**'
      - '.github/workflows/build-altare.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-altare
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.altare
          # Altare Docker Apps 只跑 linux/amd64
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/qaq60/workbuddy-manager-altare:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
